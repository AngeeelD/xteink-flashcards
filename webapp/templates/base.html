<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Xteink Flashcards{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Macondo&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%9A%96%EF%B8%8F%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main class="container">
    <header>
      <hgroup>
        <h1>{% block heading %}Xteink Flashcards{% endblock %}</h1>
        <p class="subhead">{% block subheading %}Convert an epub into per-chapter bilingual flashcards + e-ink screen saver BMPs.{% endblock %}</p>
      </hgroup>
    </header>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    Compatible with <a href="https://github.com/franssjz/cpr-vcodex" rel="noopener" target="_blank">cpr-vcodex</a> · MIT licensed
  </footer>
</body>
</html>
